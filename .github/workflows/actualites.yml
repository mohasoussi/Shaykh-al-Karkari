# Récupère automatiquement les nouveaux articles de karkariya.fr (actualités, enseignements, chaîne de transmission),
# toutes les 6 heures. S'il y a du nouveau, les pages sont enregistrées dans le dépôt : Netlify republie alors le site tout seul.
name: Nouveaux articles
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Importer les articles
        run: node scripts/importer-actualites.mjs --tolerant
      - name: Enregistrer s'il y a du nouveau
        run: |
          git config user.name "Import automatique"
          git config user.email "import@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Mise à jour automatique : nouveaux articles de karkariya.fr"
            git push
          fi
